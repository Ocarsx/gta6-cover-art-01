<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>GTA 6 Cover Art Studio III</title>
<link rel="stylesheet" href="./style.css">
</head>
<body>
<div class="app">
  <header class="topbar">
    <div>
      <h1>GTA 6 Cover Art Studio <span class="iii">III</span></h1>
      <p class="tagline">Your photos, framed like a Leonida movie poster. Fully offline.</p>
    </div>
    <div class="top-actions">
      <button id="surprise" type="button" class="primary">Surprise me</button>
      <button id="undo" type="button">Undo</button>
      <button id="redo" type="button">Redo</button>
      <button id="reset" type="button">Reset</button>
    </div>
  </header>

  <aside class="controls">
    <section>
      <h2>Words</h2>
      <label class="field">Title
        <input id="title" type="text" maxlength="30" value="SUNSET HEIST">
      </label>
      <label class="field">Subtitle
        <input id="subtitle" type="text" maxlength="48" value="One Last Summer in Leonida">
      </label>
      <label class="field">Tagline
        <input id="tagline" type="text" maxlength="60" value="EVERYONE WANTS A CUT OF THE SUNSET">
      </label>
    </section>

    <section>
      <h2>Layout</h2>
      <div id="layouts" class="chips"></div>
    </section>

    <section>
      <h2>Grade</h2>
      <div id="grades" class="chips"></div>
    </section>

    <section>
      <h2>Lettering</h2>
      <div id="letterings" class="chips"></div>
    </section>

    <section>
      <h2>Panels</h2>
      <p class="hint">Pick a panel to crop it. Every face stays whole: the crop
      follows the face, never cuts it.</p>
      <button id="one-photo" type="button">Use one photo for all panels</button>
      <div id="panels"></div>
    </section>

    <section>
      <h2>Export PNG</h2>
      <div id="exports" class="exports"></div>
      <p id="status" class="status" role="status"></p>
    </section>
  </aside>

  <main class="stage">
    <canvas id="cover" width="1080" height="1080" aria-label="The cover preview"></canvas>
    <p class="stage-note">Live preview &mdash; what you see is what the PNG saves.</p>
  </main>
</div>
<script type="module" src="./src/main.js"></script>
</body>
</html>
